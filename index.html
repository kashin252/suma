<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直飛び測定 (白背景版)</title>
    <style>
        /* 背景を白、文字を黒に強制設定 */
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #ffffff; /* 白背景 */
            color: #000000; /* 黒文字 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #height-display {
            font-size: 80px;
            font-weight: bold;
            color: #007AFF; /* 青色 */
        }
        button {
            padding: 20px 40px;
            font-size: 20px;
            background-color: #000;
            color: #fff;
            border-radius: 10px;
            margin-top: 20px;
        }
        .slider-area { margin-top: 30px; width: 80%; background: #eee; padding: 10px; }
        input { width: 100%; }
    </style>
</head>
<body>

    <h1>垂直飛び測定 (白背景)</h1>
    <div id="status">準備完了</div>

    <div>
        <span id="height-display">0.0</span> cm
    </div>

    <button onclick="initApp()" id="btn">スタート</button>

    <div class="slider-area">
        精度調整: <span id="val">90</span>%<br>
        <input type="range" id="slider" min="60" max="120" value="90" oninput="document.getElementById('val').innerText=this.value">
    </div>

    <script>
        let isMeasuring = false, inAir = false, startT = 0, filtered = 9.8;
        
        function initApp() {
            // 音声用ハック
            let ut = new SpeechSynthesisUtterance(" "); window.speechSynthesis.speak(ut);

            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(s => {
                    if(s==='granted') start();
                    else alert("センサーを許可してください");
                });
            } else { start(); }
        }

        function start() {
            window.addEventListener('devicemotion', e => {
                if(!isMeasuring) return;
                let acc = e.accelerationIncludingGravity;
                if(!acc) return;
                
                let raw = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
                filtered = filtered * 0.4 + raw * 0.6;

                // 判定
                if(filtered < 2.5 && !inAir) { inAir=true; startT=Date.now(); document.getElementById('status').innerText="計測中..."; }
                
                if(filtered > 8.0 && inAir) {
                    let t = (Date.now()-startT)/1000;
                    if(t > 0.15 && t < 1.5) {
                        let h = 122.6 * t * t * (document.getElementById('slider').value / 100);
                        document.getElementById('height-display').innerText = h.toFixed(1);
                        let ut = new SpeechSynthesisUtterance(h.toFixed(0)+"センチ");
                        window.speechSynthesis.speak(ut);
                        isMeasuring = false; inAir = false;
                        document.getElementById('status').innerText="完了 (2秒後に再開)";
                        document.getElementById('btn').style.display = 'inline-block';
                        setTimeout(() => { isMeasuring=true; document.getElementById('status').innerText="ジャンプ！"; }, 2000);
                    }
                }
            });
            document.getElementById('btn').style.display = 'none';
            document.getElementById('status').innerText = "ジャンプしてください";
            isMeasuring = true;
        }
    </script>
</body>
</html>
