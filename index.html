<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直飛び測定 (高精度版・白背景)</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #height-display {
            font-size: 80px;
            font-weight: bold;
            color: #007AFF;
        }
        button {
            padding: 20px 40px;
            font-size: 20px;
            background-color: #000;
            color: #fff;
            border-radius: 10px;
            margin-top: 20px;
            border: none;
        }
        .slider-area {
            margin-top: 30px;
            width: 80%;
            background: #eee;
            padding: 10px;
            border-radius: 10px;
        }
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>垂直飛び測定 (高精度版・白背景)</h1>
    <div id="status">スタートボタンを押して下さい</div>

    <div>
        <span id="height-display">0.0</span> cm
    </div>

    <button onclick="initApp()" id="btn">スタート</button>

    <div class="slider-area">
        精度調整: <span id="val">90</span>%<br>
        <input type="range" id="slider" min="70" max="120" value="90"
               oninput="document.getElementById('val').innerText=this.value">
        <div style="font-size: 12px; margin-top: 4px;">
            実測より高く出る場合は下げる / 低く出る場合は上げる
        </div>
    </div>

    <script>
        // 状態管理用
        let state = "idle"; // idle, calibrating, ready, inAir, waitNext
        let baselineG = 9.8;   // 静止時の加速度の大きさ（キャリブレーションで更新）
        let filteredMag = 9.8; // 平滑化した加速度
        let takeoffTime = 0;
        let lastLandingTime = 0;
        let calibrationSamples = [];
        let motionInitialized = false;

        // 閾値（baselineGを元に動的に決める）
        let takeoffThreshold = 5.0;  // baselineG * 0.6 くらい
        let landingThreshold = 13.0; // baselineG * 1.3 くらい

        const ALPHA = 0.8; // 平滑化用係数（大きいほど滑らか＆遅い）

        function initApp() {
            // 音声用ハック（iOS向け）
            let ut = new SpeechSynthesisUtterance(" ");
            window.speechSynthesis.speak(ut);

            // ボタンは一旦隠す
            document.getElementById('btn').style.display = 'none';

            if (typeof DeviceMotionEvent !== 'undefined' &&
                typeof DeviceMotionEvent.requestPermission === 'function') {

                DeviceMotionEvent.requestPermission().then(s => {
                    if (s === 'granted') {
                        startSensor();
                        startCalibration();
                    } else {
                        alert("センサーを許可してください（設定 > Safari > モーションと画面の向き）");
                        document.getElementById('btn').style.display = 'inline-block';
                    }
                });
            } else {
                // Android など permission 不要な場合
                startSensor();
                startCalibration();
            }
        }

        function startSensor() {
            if (motionInitialized) return;
            window.addEventListener('devicemotion', onMotion);
            motionInitialized = true;
        }

        function startCalibration() {
            state = "calibrating";
            calibrationSamples = [];
            document.getElementById('status').innerText =
                "キャリブレーション中... 1秒ほどまっすぐ立ってください";

            // 念のため2秒後に強制的に終了させる保険
            setTimeout(() => {
                if (state === "calibrating") {
                    finishCalibration();
                }
            }, 2000);
        }

        function finishCalibration() {
            if (calibrationSamples.length > 0) {
                let sum = 0;
                for (let v of calibrationSamples) sum += v;
                baselineG = sum / calibrationSamples.length;
            } else {
                baselineG = 9.8; // 取れなかった場合はデフォルト
            }

            filteredMag = baselineG;

            // 閾値を baseline から決定（端末差を吸収）
            takeoffThreshold  = baselineG * 0.6;  // 重力の60%以下 → 離地
            landingThreshold  = baselineG * 1.3;  // 重力の130%以上 → 着地

            state = "ready";
            document.getElementById('status').innerText =
                "準備完了！ジャンプしてください（スマホは胸あたりでしっかり固定）";
        }

        function onMotion(e) {
            // センサー値が取れない端末は何もしない
            const acc = e.accelerationIncludingGravity || e.acceleration;
            if (!acc) return;

            const ax = acc.x || 0;
            const ay = acc.y || 0;
            const az = acc.z || 0;

            // 3軸ベクトルの大きさ
            const mag = Math.sqrt(ax*ax + ay*ay + az*az);

            // ローパスフィルタで平滑化
            filteredMag = ALPHA * filteredMag + (1 - ALPHA) * mag;

            // キャリブレーション中はサンプルを貯める
            if (state === "calibrating") {
                calibrationSamples.push(mag);
                if (calibrationSamples.length >= 40) { // 約1秒分想定
                    finishCalibration();
                }
                return;
            }

            // ここからは状態機械でジャンプを検出
            const now = performance.now();

            if (state === "ready") {
                // 離地検出：重力よりかなり小さくなった瞬間
                if (filteredMag < takeoffThreshold) {
                    state = "inAir";
                    takeoffTime = now;
                    document.getElementById('status').innerText = "空中判定中...";
                }
            } else if (state === "inAir") {
                // 着地検出：重力よりかなり大きくなった瞬間
                if (filteredMag > landingThreshold) {
                    const flightTime = (now - takeoffTime) / 1000; // 秒

                    // 異常値を除外（短すぎ / 長すぎ）
                    if (flightTime > 0.15 && flightTime < 1.5) {
                        const sliderRate =
                            Number(document.getElementById('slider').value) / 100;

                        // 物理式：h(cm) ≒ 122.6 * t^2
                        let h = 122.6 * flightTime * flightTime * sliderRate;

                        document.getElementById('height-display').innerText = h.toFixed(1);

                        // 音声出力（整数cmで読み上げ）
                        let ut = new SpeechSynthesisUtterance(
                            h.toFixed(0) + "センチです"
                        );
                        window.speechSynthesis.speak(ut);

                        lastLandingTime = now;
                        state = "waitNext";
                        document.getElementById('status').innerText =
                            "計測完了！ もう一度測るには少し待ってください";

                        // 1.5秒後に次のジャンプ待ちに遷移
                        setTimeout(() => {
                            state = "ready";
                            document.getElementById('status').innerText =
                                "準備OK！もう一度ジャンプしてください";
                        }, 1500);
                    } else {
                        // 異常値の場合はリセットして再挑戦
                        state = "ready";
                        document.getElementById('status').innerText =
                            "うまく検出できませんでした。もう一度ジャンプしてください";
                    }
                }
            }
        }
    </script>
</body>
</html>
